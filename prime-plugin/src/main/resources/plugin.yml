name: PrimeClient
version: '${version}'
main: com.primeclient.PrimeClientPlugin
api-version: '1.21'
authors: [Prime]
description: Official Prime Client server bridge — detection, XP, rewards, network.
website: https://github.com/HeatzyV2/prime-client
softdepend: [PlaceholderAPI, LuckPerms, Vault]

commands:
  prime:
    description: Prime Client profile and admin tools
    usage: /prime [reload|info|rewards|achievements]
    aliases: [primeclient, pclient]

permissions:
  primeclient.verified:
    description: Verified Prime Client user badge
    default: false
  primeclient.admin:
    description: Full admin access
    default: op
  primeclient.reload:
    description: Reload configuration
    default: op
  primeclient.info:
    description: View other players' Prime profiles
    default: op
  primeclient.use:
    description: Open /prime GUI
    default: true
